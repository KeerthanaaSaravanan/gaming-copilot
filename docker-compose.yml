version: '3.8'
services:
  rag-service:
    build: ./gaming-copilot-rag
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
  copilot-agent:
    build: ./GamingCoPilot
    depends_on:
      - rag-service
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_SERVICE_URL=http://rag-service:8000
    stdin_open: true
    tty: true